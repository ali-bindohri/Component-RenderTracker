<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="header">
      <svg
        height="24"
        viewBox="0 0 24 24"
        width="24"
        fill="none"
        stroke="#58a6ff"
        stroke-width="2"
      >
        <path
          d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <h3>Render Tracker</h3>
    </div>

    <div class="control-group">
      <label class="label">Tracking Mode</label>
      <div class="mode-switch">
        <label class="mode-option">
          <input type="radio" name="trackMode" value="specific" checked />
          <span>Specific</span>
        </label>
        <label class="mode-option">
          <input type="radio" name="trackMode" value="all" />
          <span>All Apps</span>
        </label>
      </div>
    </div>

    <div class="control-group" id="nameInputGroup">
      <label class="label">Component Name</label>
      <div class="input-wrapper" style="display: flex; gap: 8px">
        <input
          type="text"
          id="componentName"
          placeholder="e.g. Header, Button"
          autocomplete="off"
        />
        <button
          id="pickBtn"
          title="Pick a component from the page"
          style="
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0 8px;
            cursor: pointer;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
          "
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"
            />
          </svg>
        </button>
      </div>
    </div>

    <div class="control-group">
      <label class="label">Highlight Color</label>
      <div
        class="color-picker-wrapper"
        style="display: flex; gap: 10px; align-items: center"
      >
        <input
          type="color"
          id="highlightColor"
          value="#58a6ff"
          style="
            cursor: pointer;
            height: 32px;
            width: 60px;
            border: 1px solid #30363d;
            background: transparent;
            padding: 0;
          "
        />
        <span id="colorLabel" style="font-size: 13px; color: #8b949e"
          >#58a6ff</span
        >
      </div>
    </div>

    <button id="startBtn">Start Tracking</button>

    <script src="popup.js"></script>
  </body>
</html>
